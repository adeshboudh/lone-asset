name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and export desktop builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Licence compliance (REUSE)
        uses: fsfe/reuse-action@v5

      - name: Read engine version
        id: engine
        run: echo "version=$(cat ENGINE_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: ~/.cache/godot-ci
          key: godot-${{ steps.engine.outputs.version }}-desktop

      - name: Install Godot ${{ steps.engine.outputs.version }}
        run: tools/ci/install_godot.sh "${{ steps.engine.outputs.version }}"

      - name: Import project
        run: godot --headless --path . --import

      - name: Smoke test
        run: tools/ci/smoke_test.sh

      - name: Unit tests
        run: tools/ci/run_tests.sh

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-report-${{ github.sha }}
          path: reports
          if-no-files-found: ignore
          retention-days: 14

      - name: Stamp build ID
        run: tools/ci/stamp_version.sh "$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"

      - name: Export Windows and Linux builds
        run: tools/ci/export_desktop.sh build | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check size budgets
        run: tools/ci/check_budgets.sh build | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Windows build
        uses: actions/upload-artifact@v5
        with:
          name: LoneAsset-windows-${{ github.sha }}
          path: build/LoneAsset-windows.zip
          compression-level: 0
          retention-days: 14

      - name: Upload Linux build
        uses: actions/upload-artifact@v5
        with:
          name: LoneAsset-linux-${{ github.sha }}
          path: build/LoneAsset-linux.zip
          compression-level: 0
          retention-days: 14

  preview-release:
    name: Publish preview release
    needs: build
    # Every push to main replaces the public "preview" pre-release, which needs no GitHub login to download.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: LoneAsset-*-${{ github.sha }}
          merge-multiple: true
          path: build

      - name: Replace the preview release
        run: |
          gh release delete preview --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create preview build/LoneAsset-windows.zip build/LoneAsset-linux.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Preview build (${GITHUB_SHA::7})" \
            --notes "Latest build of main. Windows: unzip and run LoneAsset.exe. Linux: unzip, then run ./LoneAsset.x86_64."
