name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, test and export web build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Licence compliance (REUSE)
        uses: fsfe/reuse-action@v5

      - name: Read engine version
        id: engine
        run: echo "version=$(cat ENGINE_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: ~/.cache/godot-ci
          key: godot-${{ steps.engine.outputs.version }}-web

      - name: Install Godot ${{ steps.engine.outputs.version }}
        run: tools/ci/install_godot.sh "${{ steps.engine.outputs.version }}"

      - name: Install compression tools
        run: sudo apt-get update -q && sudo apt-get install -y -q brotli

      - name: Import project
        run: godot --headless --path . --import

      - name: Smoke test
        run: tools/ci/smoke_test.sh

      - name: Stamp build ID
        run: tools/ci/stamp_version.sh "$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"

      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.wasm

      - name: Compress and report size
        run: tools/ci/compress_web.sh build/web | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Prepare Cloudflare Pages site
        run: tools/ci/prepare_site.sh build/web build/site

      - name: Check Cloudflare Pages file size limit
        run: tools/ci/check_file_sizes.sh build/site

      - name: Upload site
        uses: actions/upload-artifact@v5
        with:
          name: web-site-${{ github.sha }}
          path: build/site
          retention-days: 14

  deploy:
    name: Deploy to Cloudflare Pages
    needs: web
    # Fork pull requests have no access to secrets.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: web-site-${{ github.sha }}
          path: build/site

      - name: Deploy
        id: deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/site --project-name=lone-asset --branch=${{ github.head_ref || github.ref_name }} --commit-hash=${{ github.sha }}

      - name: Report URL
        if: steps.deploy.outcome == 'success'
        run: echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Skipped (no Cloudflare secrets)
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN not set; deploy skipped." >> "$GITHUB_STEP_SUMMARY"
