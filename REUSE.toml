[[annotations]]
path = ["tools/audio/source/pistol_shot_*.wav", "tools/audio/source/ui_*.wav", "content/audio/sfx/pistol_shot_suppressed*.wav*", "content/audio/sfx/pistol_shot_loud*.wav*", "content/audio/sfx/ui_*.wav*"]
