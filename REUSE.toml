SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "content/weapons/m4a1_custom/m4a1_custom_parts*"
precedence = "override"
SPDX-FileCopyrightText = "xlisov (Sketchfab)"
SPDX-License-Identifier = "CC-BY-NC-4.0"

[[annotations]]
