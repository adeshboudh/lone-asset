# Licensing per the REUSE specification (https://reuse.software).
# Later annotations take precedence: add third-party assets at the end of this file.
version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Lone Asset contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["docs/**", "content/**", "icon.svg", "icon.svg.import"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Lone Asset contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Third-party assets go below, one block per source, for example:
# [[annotations]]
# path = "content/textures/polyhaven/**"
# precedence = "override"
# SPDX-FileCopyrightText = "Poly Haven"
# SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "addons/gdUnit4/**"
precedence = "override"
SPDX-FileCopyrightText = "2023 Mike Schulze and gdUnit4 contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "content/environment/textures/**"
precedence = "override"
SPDX-FileCopyrightText = "Rob Tuytel (Poly Haven)"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["content/weapons/source/m416_blendswap_cc0.blend", "content/weapons/source/m416_blendswap_LICENSE.txt"]
precedence = "override"
SPDX-FileCopyrightText = "natholas (Blend Swap)"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["content/weapons/knife/source/**", "content/weapons/knife/textures/**"]
precedence = "override"
SPDX-FileCopyrightText = "Michael Karel (Sketchfab)"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["tools/audio/source/*.mp3", "content/audio/weapons/m4a1/dry.wav*"]
precedence = "override"
SPDX-FileCopyrightText = "Unknown author (recorded sounds, original page not found)"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["tools/audio/source/ui_*.wav", "content/audio/sfx/ui_*.wav*"]
precedence = "override"
SPDX-FileCopyrightText = "Generated with Stable Audio (small-sfx) by the project developer, prompts in text_to_sfx.ipynb"
SPDX-License-Identifier = "LicenseRef-Stable-Audio-generated"

[[annotations]]
path = ["content/characters/agent/**"]
precedence = "override"
SPDX-FileCopyrightText = "buh (Sketchfab)"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "addons/godot_mcp_bridge/**"
precedence = "override"
SPDX-FileCopyrightText = "GodotBridge contributors (https://github.com/godotbridge/addon)"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "content/animations/source/kimodo/**"
precedence = "override"
SPDX-FileCopyrightText = "The developer, generated with NVIDIA Kimodo"
SPDX-License-Identifier = "LicenseRef-NVIDIA-Open-Model-generated"


[[annotations]]
path = ["content/characters/fps_arms/**"]
precedence = "override"
SPDX-FileCopyrightText = "DJMaesen (Sketchfab)"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["tools/blender/helpers/RIG_UE5_Manny.blend", "tools/blender/helpers/gun_rig.fbx"]
precedence = "override"
SPDX-FileCopyrightText = "Unknown authors (UE5 Manny arms control rig; M4A1 rifle rig), controller shapes by Helindu (Sketchfab, CC-BY-4.0)"
SPDX-License-Identifier = "LicenseRef-Manny-rig-unknown"

[[annotations]]
path = ["content/audio/weapons/m4a1/fire_*.wav*", "content/audio/weapons/m4a1/reload_*.wav*", "content/audio/weapons/m4a1/magazine_*.wav*", "content/audio/weapons/m4a1/tail_outdoor.wav*", "tools/audio/source/m4a1/*.wav"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Lone Asset contributors (rifle reload sounds and animations made by the project developer)"
SPDX-License-Identifier = "CC-BY-4.0"


[[annotations]]
path = ["content/weapons/m4a1_ms/m4a1_ms_viewmodel.glb*"]
precedence = "override"
SPDX-FileCopyrightText = "Unknown author (arms and rifle model supplied by the developer; origin and terms unknown)"
SPDX-License-Identifier = "LicenseRef-Rifle-model-unknown"
